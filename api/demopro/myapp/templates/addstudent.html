    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">ADD STUDENT</h1>

        <form action="" method="post" class="w-50 mx-auto border rounded p-4 bg-white shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Rollno</label>
                <input type="number" class="form-control" id="title" name="rollno">
            </div>

            <div class="mb-3">
                <label for="" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name">
            </div>

            <div class="mb-3">
                <label for="Price" class="form-label">Age</label>
                <input type="number" class="form-control" id="age" name="age">
            </div>

            <div class="mb-3">
                <label for="language" class="form-label">Place</label>
                <input type="text" class="form-control" id="place" name="place">
            </div>

            <div class="mb-3">
                <label for="marks" class="form-label">Marks</label>
                <input type="number" class="form-control" id="marks" name="marks">
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
