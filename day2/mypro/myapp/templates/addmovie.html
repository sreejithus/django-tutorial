<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Add Movie</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">ADD MOVIE</h1>

        <form action="" method="post" class="w-50 mx-auto border rounded p-4 bg-white shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="movie_name" class="form-label">Movie Name</label>
                <input type="text" class="form-control" id="movie_name" name="movie_name">
            </div>

            <div class="mb-3">
                <label for="director" class="form-label">Director</label>
                <input type="text" class="form-control" id="director" name="director">
            </div>

            <div class="mb-3">
                <label for="year" class="form-label">Release Year</label>
                <input type="number" class="form-control" id="year" name="year">
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>
</html>
